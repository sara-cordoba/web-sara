<!doctype html>
<!--
  Plantilla de la imagen que sale al compartir la web (Open Graph), 1200 × 630.
  Se abre con ?idioma=es, ?idioma=ca o ?idioma=en, se hace una captura a ese tamaño y se
  guarda en public/og/sara-cordoba-<idioma>.jpg. Los textos siguen los de
  src/i18n: si cambian arriba, se vuelve a sacar.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(900px 500px at 85% 20%, rgba(163,217,119,0.10), transparent 60%), #060607;
    color: #f5f0e6;
    font-family: "Space Grotesk", sans-serif;
    display: flex; align-items: center; gap: 64px;
    padding: 0 80px;
  }
  .foto {
    flex: none; width: 360px; height: 360px; border-radius: 28px; overflow: hidden;
    border: 1px solid rgba(163,217,119,0.22);
    box-shadow: 0 0 60px -10px rgba(163,217,119,0.35);
    background: linear-gradient(135deg, #18342a, #0d3b2e);
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pastilla {
    display: inline-flex; align-items: center; gap: 10px;
    font: 500 18px "JetBrains Mono", monospace; letter-spacing: 0.06em; color: #a3d977;
    padding: 8px 16px; border: 1px solid rgba(163,217,119,0.22); border-radius: 999px;
    background: rgba(163,217,119,0.05);
  }
  .pastilla::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #a3d977; box-shadow: 0 0 8px #a3d977; }
  h1 { font-weight: 600; font-size: 76px; line-height: 1.02; letter-spacing: -0.035em; margin: 26px 0 22px; }
  h1 span { color: #a3d977; }
  p { font-size: 28px; line-height: 1.35; color: #c8c3b8; max-width: 620px; }
  .web { margin-top: 30px; font: 500 22px "JetBrains Mono", monospace; color: #a3d977; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="foto"><img src="../public/img/sara.png" alt=""></div>
  <div>
    <div class="pastilla" id="pastilla"></div>
    <h1>Sara <span>Córdoba</span></h1>
    <p id="lema"></p>
    <div class="web">saracordoba.com</div>
  </div>
<script>
  const T = {
    es: { pastilla: "España · Remoto", lema: "Diseño y desarrollo web · WordPress · Branding · Diseño gráfico · Contenido para redes · Chatbots con IA" },
    ca: { pastilla: "Espanya · En remot", lema: "Disseny i desenvolupament web · WordPress · Branding · Disseny gràfic · Contingut per a xarxes · Xatbots amb IA" },
    en: { pastilla: "Spain · Remote", lema: "Web design and development · WordPress · Branding · Graphic design · Social media content · AI chatbots" },
  };
  const t = T[new URLSearchParams(location.search).get("idioma")] || T.es;
  document.getElementById("pastilla").textContent = t.pastilla;
  document.getElementById("lema").textContent = t.lema;
  document.documentElement.lang = Object.keys(T).find((k) => T[k] === t);
</script>
</body>
</html>
